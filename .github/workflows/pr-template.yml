name: PR template

# Sprawdza, czy treść PR-a ma wypełnioną matrycę testów, macierz dowodów
# i linki do issue (#49). Okres obserwacji: check nie jest wymagany przez
# ochronę gałęzi. Drafty są pomijane; PR-y Dependabota mają własny opis
# bez szablonu, więc dostają zwolnienie zamiast czerwonego checku.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read # odczyt PR-a; treść opisu trafia do skryptu przez env

# Nowa edycja opisu albo push zastępuje trwający przebieg: liczy się najnowsza treść.
concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Dependabot exemption
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "PR Dependabota – szablon nie obowiązuje, check zaliczony." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the PR body against the template
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          node scripts/quality/pr-template.js | tee -a "$GITHUB_STEP_SUMMARY"
