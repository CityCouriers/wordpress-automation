name: Deploy to Apps Script

# Gated deployment of the repository sources to the Apps Script project.
#
# Triggers:
#   - release published  → deploys the released tag (pre-releases are skipped)
#   - workflow_dispatch  → deploys the `deploy_ref` input: `main` (default)
#                          for a hotfix, or a `vX.Y.Z` tag for a rollback. Start
#                          the run from `main` so this workflow definition is
#                          used (older tags carry older workflow files); the job
#                          `if:` skips a manual run started from any other ref.
#
# Either way the `production` environment requires a reviewer to approve the
# run before any secret is exposed or any file is pushed, and lint must pass
# before clasp push runs.
#
# #297: tuż przed `clasp push` workflow zapisuje jawny rekord GitHub Deployments
# w środowisku `apps-script-live` (ref = pełny SHA faktycznie wypchniętego
# checkoutu, payload.tag = DEPLOY_REF) i ustawia jego status: in_progress przed
# pushem, success po weryfikacji z #44, failure po niepowodzeniu po pushu.
# Tygodniowy drift check porównuje żywy projekt z rewizją z tego rekordu.
#
# Required repository secrets:
#   CLASPRC_JSON    contents of ~/.clasprc.json after `clasp login`
#   APPS_SCRIPT_ID  the Apps Script project id (Project settings → Script ID)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "What to deploy: main, or a release tag such as v2.9.1 to roll back"
        type: string
        default: main
      create_version:
        description: "Also create an immutable Apps Script version after the push"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  push:
    name: push
    # #296 (AC-3): ręczne uruchomienie tylko z main (definicja workflow z main),
    # zanim job wejdzie do środowiska i odczyta sekrety. To zabezpieczenie przed
    # pomyłką w zatwierdzonym kodzie: gałąź robocza może je usunąć razem z resztą
    # YAML (ryzyko zaakceptowane przez właściciela, wariant A). release bez zmian.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write # wyłącznie zapis rekordu wdrożenia apps-script-live (#297)
    env:
      # Released tag for release events; the deploy_ref input for manual runs.
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.deploy_ref }}
      # Every release gets an immutable Apps Script version; manual runs opt in.
      CREATE_VERSION: ${{ github.event_name == 'release' || inputs.create_version == true }}
    steps:
      # #296 (AC-3): ścisły wzorzec (ten sam co TAG_PATTERN w deployment-record.js)
      # i jednorazowe rozwiązanie refów do pełnych SHA commitów (tag lekki
      # i adnotowany: endpoint commits zwraca commit, nie obiekt taga). Oba
      # checkouty biorą SHA z wyjść tego kroku, więc przesunięcie main albo taga
      # w trakcie biegu nie zmienia wdrażanego kodu ani narzędzi.
      - name: Validate deploy ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Guard w if: joba porównuje napisy bez wielkości liter (gałąź Main by przeszła); bash je rozróżnia.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::manual deploy must be started from refs/heads/main, got $(printf '%q' "$GITHUB_REF")"; exit 1
          fi
          ref_re='^(main|v[0-9]+\.[0-9]+\.[0-9]+)$'
          if [[ ! "$DEPLOY_REF" =~ $ref_re ]]; then
            echo "::error::deploy_ref must be 'main' or a release tag vX.Y.Z, got $(printf '%q' "$DEPLOY_REF")"; exit 1
          fi
          if [ "$DEPLOY_REF" = main ]; then kind=heads; else kind=tags; fi
          resolve() { gh api "repos/$GITHUB_REPOSITORY/commits/refs/$1" --jq '.sha'; }
          if ! deploy_sha=$(resolve "$kind/$DEPLOY_REF"); then
            echo "::error::ref '$DEPLOY_REF' does not exist in $GITHUB_REPOSITORY"; exit 1
          fi
          if [ "$DEPLOY_REF" = main ]; then
            tooling_sha=$deploy_sha
          elif ! tooling_sha=$(resolve heads/main); then
            echo "::error::cannot resolve main in $GITHUB_REPOSITORY"; exit 1
          fi
          sha_re='^[0-9a-f]{40}$'
          if [[ ! "$deploy_sha" =~ $sha_re || ! "$tooling_sha" =~ $sha_re ]]; then
            echo "::error::ref resolution did not return full commit SHAs"; exit 1
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=$tooling_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $DEPLOY_REF ($deploy_sha), tooling from main ($tooling_sha)"

      - name: Checkout ${{ env.DEPLOY_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.deploy_sha }}
          persist-credentials: false

      # Tooling always comes from main, resolved once to a SHA above, so a
      # rollback to a tag that predates these scripts still gets verified.
      - name: Checkout deploy tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.tooling_sha }}
          persist-credentials: false
          path: .deploy-tooling
          sparse-checkout: |
            scripts/quality/apps-script-compare.js
            scripts/quality/apps-script-drift.js
            scripts/quality/deployment-record.js
          sparse-checkout-cone-mode: false

      # #296 (AC-3): job z sekretami nie odtwarza cache npm. Cache zapisany na
      # main jest widoczny dla biegów z innych refów (GitHub Docs, „Restrictions
      # for accessing a cache”), a setup-node od v5 włącza go sam, gdy
      # package.json ma pole packageManager; stąd jawne package-manager-cache:
      # false. CI zachowuje cache (ci.yml, job validate).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # --ignore-scripts: jedyny skrypt instalacyjny to prepare (hook pre-commit),
      # którego lint, testy i clasp nie potrzebują; zależności nie mają własnych.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # Third line of defence: the same tests and coverage thresholds that
      # guard commits (pre-commit) and merges (CI) must pass on the exact ref
      # being deployed, after the production approval and before clasp push.
      - name: Unit tests + coverage thresholds
        shell: bash
        # Older tags (rollback targets) may predate the gate or the tests;
        # run whatever the deployed ref has, never skip silently.
        run: |
          set -euo pipefail
          if [ -f scripts/quality/coverage-gate.js ]; then
            npm run quality:gate -- --changed=none
          elif [ -d test ]; then
            npm test
          else
            echo "::warning::${DEPLOY_REF} has no tests or coverage gate; only lint ran."
          fi

      # clasp comes from devDependencies (pinned by package-lock.json, bumped
      # by Dependabot), so every deploy uses the same version.
      - name: clasp version
        run: npx clasp --version

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLASPRC_JSON:?Missing CLASPRC_JSON repository secret}"
          : "${APPS_SCRIPT_ID:?Missing APPS_SCRIPT_ID repository secret}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # scriptExtensions keeps clasp 3 on .gs (its default is .js).
          # rootDir zależy od układu wdrażanego refa: źródła mieszkają w src/ od #105,
          # ale rollback do wcześniejszego taga ma je w katalogu głównym.
          if [ -f src/appsscript.json ]; then ROOT_DIR=src; else ROOT_DIR=.; fi
          echo "clasp rootDir: $ROOT_DIR"
          printf '{"scriptId":"%s","rootDir":"%s","scriptExtensions":["gs"]}\n' "$APPS_SCRIPT_ID" "$ROOT_DIR" > .clasp.json

      # Version.gs in the repo holds placeholders; the deployed copy carries the
      # tag, commit, time and actor so the sheet menu can show what is live.
      - name: Stamp deployed version into Version.gs
        shell: bash
        # Values go through JSON.stringify, so a quote or backslash in a tag
        # name can never break or inject into the generated JavaScript.
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const v = {
            tag: process.env.DEPLOY_REF,
            commit: execSync('git rev-parse --short HEAD').toString().trim(),
            deployedAt: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            deployedBy: process.env.GITHUB_ACTOR
          };
          const body = Object.entries(v)
            .map(([k, val]) => `  ${k}: ${JSON.stringify(String(val))}`)
            .join(',\n');
          // Ten sam wybór układu co przy .clasp.json: rollback do starszego taga
          // ma Version.gs w katalogu głównym.
          const versionFile = fs.existsSync('src/appsscript.json') ? 'src/Version.gs' : 'Version.gs';
          fs.writeFileSync(versionFile,
            '/**\n' +
            ' * Wygenerowane przez workflow "Deploy to Apps Script". Nie edytuj ręcznie.\n' +
            ` * Źródło: https://github.com/${process.env.GITHUB_REPOSITORY}/releases\n` +
            ' */\n' +
            `const DEPLOYED_VERSION = {\n${body}\n};\n`);
          EOF
          if [ -f src/appsscript.json ]; then VERSION_FILE=src/Version.gs; else VERSION_FILE=Version.gs; fi
          cat "$VERSION_FILE"
          # Syntax check with the project's ESLint config (node --check rejects .gs).
          npx eslint "$VERSION_FILE"

      - name: Files that will be pushed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage  # test artefact from the gate step; ignored by clasp, but keeps the list readable
          { echo "## Deploy ${DEPLOY_REF} ($(git rev-parse --short HEAD))"; echo; echo '```'; npx clasp status; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      # #297: rekord powstaje po checkoucie, więc jego ref to wynik
      # `git rev-parse HEAD` wdrażanego refa (nie SHA zdarzenia uruchamiającego:
      # rollback uruchomiony z main ma inny). Zawiedzie tu zapis, wdrożenie staje
      # przed pushem (fail-closed), nic nie jest wypchnięte.
      - name: Record deployment (in_progress)
        id: deploy_record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .deploy-tooling/scripts/quality/deployment-record.js start

      - name: Push to Apps Script
        run: npx clasp push --force

      - name: Create immutable version
        if: env.CREATE_VERSION == 'true'
        shell: bash
        # Use the checked-out commit, not GITHUB_SHA: a manual run dispatched
        # from another ref would otherwise label the version with the wrong SHA.
        run: |
          set -euo pipefail
          npx clasp version "${DEPLOY_REF} ($(git rev-parse --short HEAD)) deployed from GitHub by ${GITHUB_ACTOR}" | tee -a "$GITHUB_STEP_SUMMARY"

      # #44: prove the live project is exactly what we pushed, right now, not
      # at the next weekly drift check. The push already happened: a red step
      # here means "investigate or roll back with deploy_ref", not "retry".
      - name: Verify the live project matches ${{ env.DEPLOY_REF }}
        id: verify
        run: node .deploy-tooling/scripts/quality/apps-script-compare.js --cwd . --label "$DEPLOY_REF"

      # #297: status końcowy rekordu. Po pushu wszystko poza udaną weryfikacją
      # (porażka pushu, wersji, porównania, anulowanie) daje failure; padnięty
      # runner zostawia in_progress, które drift check też traktuje jako czerwone.
      - name: Record deployment result
        if: always() && steps.deploy_record.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_RECORD_ID: ${{ steps.deploy_record.outputs.id }}
          DEPLOY_RESULT: ${{ steps.verify.outcome == 'success' && 'success' || 'failure' }}
        run: node .deploy-tooling/scripts/quality/deployment-record.js finish --id "$DEPLOY_RECORD_ID" --state "$DEPLOY_RESULT"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
