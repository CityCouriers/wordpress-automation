name: Apps Script drift check

# Wykrywa zmiany w żywym projekcie Apps Script, których nie wprowadziło wdrożenie
# z tego repozytorium (edycja w edytorze Apps Script, ręczny `clasp push`) albo
# ostatnie wdrożenie, które nie zakończyło się poprawnie. Pobiera żywy projekt i
# porównuje go z rewizją WDROŻONĄ, nie z `main`: scalenie do `main` przed
# wdrożeniem, hotfix z `main` i rollback do starszego tagu nie są alarmem.
#
# Rewizję wskazuje najnowszy jawny rekord GitHub Deployments środowiska
# `apps-script-live` (ref = pełny SHA checkoutu, payload.tag = DEPLOY_REF), który
# zapisuje wyłącznie workflow wdrożenia (#297). Brak rekordu, status inny niż
# success, niespójny tag/SHA albo różnica w plikach (w tym w całym Version.gs)
# to czerwone. Ręczne `compare_ref` to tryb DIAGNOSTYCZNY: porównuje z podaną
# rewizją jako danymi i nie zastępuje kontroli regularnej; bieg zaplanowany
# go nigdy nie czyta.
#
# Rozdział kodu od danych (#297): kod narzędzia i `npm ci` pochodzą wyłącznie
# z `main`; porównywana rewizja jest czytana jako dane (`git show`), nigdy
# wykonywana. To chroni przed pomyłką w zatwierdzonym kodzie, nie przed zmianą
# tego pliku na gałęzi roboczej: workflow uruchomiony ręcznie z takiej gałęzi
# dostaje te same sekrety repozytorium (ryzyko zaakceptowane przez właściciela
# w #296, wariant A).
#
# Uses the same repository secrets as the deploy workflow.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      compare_ref:
        description: "DIAGNOSTYCZNIE (nie zastępuje kontroli regularnej): porównaj z rewizją main, tagiem v* albo pełnym SHA zamiast z wdrożoną rewizją z rekordu Deployments. Puste = kontrola regularna"
        type: string
        default: ""

permissions:
  contents: read
  deployments: read # odczyt rekordu wdrożenia apps-script-live (#297)

# Bez anulowania: przerwany bieg zostawiłby poświadczenia bez kroku sprzątania.
concurrency:
  group: apps-script-drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Kod narzędzia, package-lock.json i historia (tagi, przodkowie main) tylko
      # z main. Wejście compare_ref nie steruje checkoutem.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # #296 (AC-3): job z sekretami nie odtwarza cache npm (powód w
      # deploy-apps-script.yml przy tym samym kroku).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # clasp comes from devDependencies, pinned by package-lock.json.
      # --ignore-scripts: prepare (hook pre-commit) nie jest tu potrzebny.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Żywy projekt trafia do czystego katalogu live/: pliki z main nie mogą
      # udawać plików żywego projektu.
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLASPRC_JSON:?Missing CLASPRC_JSON repository secret}"
          : "${APPS_SCRIPT_ID:?Missing APPS_SCRIPT_ID repository secret}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir -p live
          # scriptExtensions keeps clasp 3 on .gs (its default is .js).
          printf '{"scriptId":"%s","rootDir":".","scriptExtensions":["gs"]}\n' "$APPS_SCRIPT_ID" > live/.clasp.json

      # Logika w scripts/quality/apps-script-compare.js (testowana jednostkowo):
      # odczyt rekordu, spójność tag/SHA, drzewo rewizji jako dane, porównanie.
      # Wejścia tylko przez env, bez interpolacji w powłokę.
      - name: Pull live project and compare with the deployed revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPARE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_ref || '' }}
        run: node scripts/quality/apps-script-compare.js --drift --cwd live --repo-dir . --patch apps-script-drift.patch

      - name: Upload drift patch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-script-drift
          path: apps-script-drift.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" live/.clasp.json
